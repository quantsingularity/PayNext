# Docker profile: run against PostgreSQL instead of the in-memory H2 default.
# The datasource URL, username, and password are supplied by the environment
# (SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD),
# which take precedence over the base application.properties. This file overrides the
# H2-specific driver and dialect from the base configuration.
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
